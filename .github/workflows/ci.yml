name: CI

on:
  push:
    branches: [main]
  pull:
    branches: [main]

jobs: 
  express-app:
    runs-on: ubuntu-latest
    defaults:
      run: 
        working-directory: express-app

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with: 
          node-version: 20
      
      - run: npm ci

      - run: node --check server.js